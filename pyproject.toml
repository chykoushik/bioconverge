[build-system]
requires = ["setuptools>=77,<83", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "bioconverge"
version = "0.2.0"
description = "Patient-level biological score integration, concordance, archetypes, model fragility, and evidence annotation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Koushik C."}]
keywords = [
    "bioinformatics", "computational biology", "cancer informatics",
    "biological score integration", "patient stratification", "multi-omics",
    "concordance analysis", "archetype discovery", "reproducible research",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.3,<2",
    "matplotlib>=3.7,<4",
    "lifelines>=0.28,<0.31",
    "requests>=2.31,<3",
]

[project.urls]
Repository = "https://github.com/chykoushik/bioconverge"
Issues = "https://github.com/chykoushik/bioconverge/issues"

[project.optional-dependencies]
topology = ["umap-learn>=0.5.7,<0.6", "hdbscan>=0.8.33,<0.9"]
report = ["plotly>=5.18,<7"]
torch = ["torch>=2.2,<3"]
tensorflow = ["tensorflow>=2.16,<3"]
notebook = ["jupyterlab>=4,<5", "nbformat>=5.9,<6", "plotly>=5.18,<7"]
test = ["pytest>=8,<10", "build>=1.2,<2", "twine>=5,<7"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["bioconverge*"]
exclude = ["tests*", "dataset*", "output*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error", "ignore:Tensorflow not installed; ParametricUMAP will be unavailable:ImportWarning"]
